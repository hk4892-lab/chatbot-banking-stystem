<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BankBot Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #161b22;
        --accent: #58a6ff;
        --text: #c9d1d9;
        --muted: #8b949e;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        width: min(720px, 100%);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      header {
        text-align: center;
      }
      header h1 {
        margin: 0;
        font-size: 1.8rem;
        color: var(--accent);
      }
      header p {
        margin: 4px 0 0 0;
        color: var(--muted);
      }
      .chat-log {
        background: var(--panel);
        border-radius: 12px;
        padding: 16px;
        height: 60vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.25);
      }
      .message {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .message.user {
        align-items: flex-end;
      }
      .bubble {
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(88, 166, 255, 0.1);
        max-width: 80%;
        white-space: pre-wrap;
      }
      .message.user .bubble {
        background: rgba(88, 166, 255, 0.25);
      }
      .meta {
        font-size: 0.75rem;
        color: var(--muted);
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      textarea {
        background: var(--panel);
        color: var(--text);
        border: 1px solid rgba(88, 166, 255, 0.2);
        border-radius: 8px;
        padding: 12px;
        resize: vertical;
        min-height: 80px;
        font-size: 1rem;
      }
      button {
        background: var(--accent);
        color: #0d1117;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s ease-in-out;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .error {
        color: #ff7b72;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>BankBot</h1>
        <p>Multilingual banking assistant • Enter to send, Shift+Enter for newline</p>
      </header>
      <section id="chat-log" class="chat-log"></section>
      <form id="chat-form">
        <textarea id="chat-input" placeholder="Ask a banking question..." required></textarea>
        <button type="submit">Send</button>
        <div id="error" class="error" role="alert"></div>
      </form>
    </div>
    <script>
      const API_URL = "http://127.0.0.1:8000/chat";
      const chatLog = document.getElementById("chat-log");
      const chatForm = document.getElementById("chat-form");
      const chatInput = document.getElementById("chat-input");
      const errorBox = document.getElementById("error");
      const messages = [];

      function renderMessage(role, text, source) {
        const wrapper = document.createElement("div");
        wrapper.className = `message ${role}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${role === "user" ? "You" : "BankBot"}${source ? " • " + source : ""}`;
        wrapper.appendChild(meta);
        wrapper.appendChild(bubble);
        chatLog.appendChild(wrapper);
        chatLog.scrollTop = chatLog.scrollHeight;
      }

      function setLoading(state) {
        chatForm.querySelector("button").disabled = state;
        chatInput.disabled = state;
      }

      chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.textContent = "";
        const text = chatInput.value.trim();
        if (!text) {
          return;
        }

        const userMessage = { role: "user", content: text };
        messages.push(userMessage);
        renderMessage("user", text, "");
        chatInput.value = "";

        setLoading(true);
        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages }),
          });

          if (!response.ok) {
            throw new Error(`API error: ${response.status}`);
          }

          const data = await response.json();
          messages.push({ role: "assistant", content: data.reply });
          renderMessage("assistant", data.reply, data.source);
        } catch (error) {
          console.error(error);
          errorBox.textContent = "Unable to reach the API. Please try again.";
          messages.pop();
        } finally {
          setLoading(false);
          chatInput.focus();
        }
      });

      chatInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          chatForm.dispatchEvent(new Event("submit"));
        }
      });
    </script>
  </body>
</html>
