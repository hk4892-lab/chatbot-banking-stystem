[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bankbot"
version = "0.1.0"
description = "Multilingual banking support chatbot demo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BankBot Team" }]
dependencies = [
    "fastapi>=0.110,<0.112",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.36",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dateutil>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
transformers = ["sentence-transformers>=2.2"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app", "app.*", "scripts", "ui"]
