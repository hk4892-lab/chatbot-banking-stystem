[project]
name = "bankbot"
version = "0.1.0"
description = "Multilingual banking support chatbot with PII redaction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "BankBot Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = []
